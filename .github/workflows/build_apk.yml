name: Build & Release CacheClean APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Full Native Flutter Project
        run: |
          mkdir -p /tmp/build_workspace
          cd /tmp/build_workspace
          flutter create --org com.cacheclean cacheclean
          cp -r $GITHUB_WORKSPACE/lib/* cacheclean/lib/
          cp $GITHUB_WORKSPACE/pubspec.yaml cacheclean/pubspec.yaml
          cd cacheclean
          flutter pub get
          flutter build apk --debug
          mkdir -p $GITHUB_WORKSPACE/apk_output
          cp build/app/outputs/flutter-apk/*.apk $GITHUB_WORKSPACE/apk_output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CacheClean-app-debug
          path: apk_output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "CacheClean v1.0.0 (APK Instalable)"
          body: "Descarga directa del APK de CacheClean para Android."
          files: apk_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
