name: Build & Release CacheClean APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate clean Android project structure
        run: |
          mkdir -p /tmp/fresh
          cd /tmp/fresh
          flutter create --platforms=android --org=com.cacheclean fresh_app
          cp -r fresh_app/android $GITHUB_WORKSPACE/
          cd $GITHUB_WORKSPACE

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CacheClean-app-debug
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "CacheClean v1.0.0 (APK Instalable)"
          body: "Descarga directa del APK de CacheClean para Android."
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
