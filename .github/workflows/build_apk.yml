name: Build & Release CacheClean APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recrear estructura nativa de Android si es necesario
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name=cacheclean --platforms=android
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --split-per-abi=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CacheClean-app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release (con APK descargable)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
